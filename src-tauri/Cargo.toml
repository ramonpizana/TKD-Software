[package]
name = "tkd-software"
version = "0.1.0"
description = "Local-first ring host for taekwondo poomsae scoring"
authors = ["Ramon Pizana"]
license = "MIT"
repository = "https://github.com/ramonpizana/TKD-Software"
default-run = "tkd-software"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "tkd_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { path = "../vendor/tauri-build", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
