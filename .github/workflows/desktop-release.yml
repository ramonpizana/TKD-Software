name: desktop-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}\src-tauri\target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Install dependencies
        run: npm ci

      - name: Validate repo
        run: npm run validate

      - name: Build desktop installer
        run: npm run desktop:build

      - name: Print artifact locations
        run: npm run desktop:artifacts

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tkd-software-windows-installer
          if-no-files-found: error
          path: |
            ${{ env.CARGO_TARGET_DIR }}\release\bundle\nsis\*.exe

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $files = Get-ChildItem "$env:CARGO_TARGET_DIR\release\bundle\nsis\*.exe" | Select-Object -ExpandProperty FullName
          if (-not $files) {
            throw "No NSIS installer artifacts were produced."
          }

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $files --clobber
          } else {
            gh release create $tag $files --title "TKD-Software $tag" --generate-notes
          }
